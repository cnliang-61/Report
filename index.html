<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>檢驗報告提取工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Microsoft JhengHei','Noto Sans TC',sans-serif; background:#f5f4f0; color:#1a1a1a; min-height:100vh; padding:2rem; }
h1 { font-size:1.5rem; font-weight:600; letter-spacing:.02em; margin-bottom:.25rem; }
.subtitle { font-size:.85rem; color:#888; margin-bottom:2rem; }
.card { background:#fff; border:1px solid #e0ddd6; border-radius:12px; padding:1.5rem; margin-bottom:1.25rem; }
.section-title { font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:#999; margin-bottom:1rem; }
.subsection { font-size:.8rem; font-weight:600; color:#555; margin:1rem 0 .5rem; padding-bottom:.25rem; border-bottom:1px solid #ece9e2; }
.grid-6 { display:grid; grid-template-columns:repeat(6,1fr); gap:.6rem; }
.grid-5 { display:grid; grid-template-columns:repeat(5,1fr); gap:.6rem; }
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.span2 { grid-column:span 2; }
.f label { display:block; font-size:.72rem; color:#888; margin-bottom:.25rem; font-weight:600; letter-spacing:.04em; }
.f input, .f select { width:100%; padding:.4rem .65rem; border:1px solid #e0ddd6; border-radius:7px; font-family:inherit; font-size:.85rem; background:#faf9f7; color:#1a1a1a; outline:none; transition:border-color .15s; }
.f input:focus, .f select:focus { border-color:#639922; }
.f input[readonly] { background:#f0f0ee; color:#888; cursor:default; }
.radio-group { display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; margin-top:.25rem; }
.radio-group label { font-size:.85rem; color:#333; font-weight:400; display:flex; align-items:center; gap:.25rem; cursor:pointer; }
.radio-group input[type=radio],.radio-group input[type=checkbox] { width:auto; }
.check-group { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin-top:.25rem; }
.check-group label { font-size:.82rem; color:#333; font-weight:400; display:flex; align-items:center; gap:.25rem; cursor:pointer; }
.check-group input { width:auto; }
.exam-row { display:grid; grid-template-columns:90px 1fr; gap:.75rem; align-items:center; padding:.45rem 0; border-bottom:1px solid #f0ede8; }
.exam-row:last-child { border-bottom:none; }
.exam-label { font-size:.82rem; font-weight:600; color:#555; }
.bp-wrap { display:flex; align-items:center; gap:.4rem; }
.bp-wrap input { flex:1; }
.bp-sep { font-size:1.1rem; color:#aaa; }
.drop-zone { border:2px dashed #d0cdc6; border-radius:10px; padding:2rem; text-align:center; cursor:pointer; transition:border-color .2s,background .2s; background:#faf9f7; }
.drop-zone:hover,.drop-zone.dragover { border-color:#3B6D11; background:#f0f7e8; }
.drop-zone .icon { font-size:2rem; margin-bottom:.5rem; display:block; color:#aaa; }
.drop-zone p { font-size:.9rem; color:#666; }
.drop-zone span { font-size:.78rem; color:#aaa; }
#fileInput { display:none; }
.file-loaded { background:#f0f7e8; border-color:#639922; }
.file-loaded .icon { color:#639922; }
.tab-row { display:flex; margin-bottom:1.25rem; border-bottom:2px solid #e0ddd6; }
.tab-btn { padding:.5rem 1.1rem; font-size:.85rem; font-weight:500; font-family:inherit; background:transparent; border:none; border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; color:#888; transition:color .15s,border-color .15s; }
.tab-btn.active { color:#3B6D11; border-bottom-color:#3B6D11; }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
textarea.paste-input { width:100%; font-family:'Courier New',monospace; font-size:.75rem; border:1px solid #e0ddd6; border-radius:8px; padding:.75rem; background:#faf9f7; color:#333; resize:vertical; min-height:200px; line-height:1.6; outline:none; }
textarea.paste-input:focus { border-color:#639922; }
.tag-row { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.6rem; }
.tag { font-size:.7rem; padding:2px 9px; border-radius:20px; border:1px solid #e0ddd6; color:#555; background:#fafaf8; }
.tag.found { background:#eaf3de; border-color:#97c459; color:#3B6D11; }
.tag.missing { background:#fcebeb; border-color:#f09595; color:#a32d2d; }
textarea.csv-out { width:100%; font-family:'Courier New',monospace; font-size:.73rem; border:1px solid #e0ddd6; border-radius:8px; padding:.65rem; background:#faf9f7; color:#333; resize:vertical; min-height:75px; line-height:1.5; }
.result-title { font-size:.95rem; font-weight:600; color:#2a2a2a; margin-bottom:.6rem; }
.result-label { font-size:.72rem; font-weight:600; color:#888; text-transform:uppercase; letter-spacing:.07em; margin-bottom:.35rem; }
.btn { display:inline-block; padding:.55rem 1.3rem; border-radius:8px; font-size:.88rem; font-weight:500; cursor:pointer; border:none; transition:opacity .15s,transform .1s; font-family:inherit; }
.btn:active { transform:scale(.98); }
.btn-primary { background:#3B6D11; color:#fff; }
.btn-primary:hover { background:#27500A; }
.btn-outline { background:transparent; border:1px solid #ccc; color:#444; }
.btn-outline:hover { background:#f5f4f0; }
.btn-row { display:flex; gap:.65rem; flex-wrap:wrap; margin-top:1rem; }
.btn-secondary { background:#6b8e23; color:#fff; }
.btn-secondary:hover { background:#556b1a; }
.file-path-info { font-size:.75rem; color:#666; margin-top:.5rem; font-style:italic; }
#status { font-size:.83rem; color:#888; margin-top:.5rem; min-height:1.1rem; }
#status.ok { color:#3B6D11; }
#status.err { color:#a32d2d; }
.divider { border:none; border-top:1px solid #ece9e2; margin:1.1rem 0; }
.hidden { display:none; }
.paste-hint { font-size:.75rem; color:#aaa; margin-top:.4rem; }
</style>
</head>
<body>

<h1>🔬 檢驗報告提取工具</h1>
<p class="subtitle">填寫資料後貼上或上傳檢驗報告，一鍵直接生成成人／長者兩份 Word 報告</p>

<!-- ══ 基本資料 ══ -->
<div class="card">
  <div class="section-title">基本資料</div>
  <div class="grid-6" style="margin-bottom:.75rem;">
    <div class="f"><label>姓名</label><input type="text" id="f_name"></div>
    <div class="f"><label>性別</label>
      <select id="f_gender"><option value="">請選擇</option><option>男</option><option>女</option></select>
    </div>
    <div class="f"><label>病歷號</label><input type="text" id="f_sn"></div>
    <div class="f"><label>生日（8碼）</label><input type="text" id="f_dob" placeholder="19520311" oninput="calcAge()"></div>
    <div class="f"><label>採檢日期（8碼）</label><input type="text" id="f_date" placeholder="20251211" oninput="calcAge()"></div>
    <div class="f"><label>年齡</label><input type="text" id="f_age" readonly></div>
  </div>
  <div class="grid-5">
    <div class="f"><label>身高（cm）</label><input type="text" id="f_bh" oninput="calcBMI()"></div>
    <div class="f"><label>體重（kg）</label><input type="text" id="f_bw" oninput="calcBMI()"></div>
    <div class="f"><label>BMI（自動）</label><input type="text" id="f_bmi" readonly></div>
    <div class="f"><label>腰圍（cm）</label><input type="text" id="f_waist"></div>
    <div class="f"><label>脈搏</label><input type="text" id="f_hb"></div>
  </div>
  <div class="grid-5" style="margin-top:.6rem;">
    <div class="f span2">
      <label>血壓（收縮壓 / 舒張壓）</label>
      <div class="bp-wrap">
        <input type="text" id="f_sys" placeholder="120">
        <span class="bp-sep">/</span>
        <input type="text" id="f_dia" placeholder="80">
      </div>
    </div>
    <div class="f"><label>B肝表面抗原</label>
      <select id="f_hbv"><option>未檢查</option><option>陰性</option><option>陽性</option><option>進一步檢查</option></select>
    </div>
    <div class="f"><label>C肝抗體</label>
      <select id="f_hcv"><option>未檢查</option><option>陰性</option><option>陽性</option><option>進一步檢查</option></select>
    </div>
  </div>
</div>

<!-- ══ 理學檢查 ══ -->
<div class="card">
  <div class="section-title">理學檢查</div>

  <div class="subsection">耳鼻喉及口腔</div>
  <div class="radio-group" style="margin-bottom:.5rem;">
    <label><input type="radio" name="ent_main" id="ent1" value="normal" checked> 無明顯異常</label>
    <label><input type="radio" name="ent_main" id="ent2" value="abnormal"> 異常</label>
  </div>
  <div class="check-group">
    <label><input type="checkbox" id="ent_hearing" onchange="entAbnormal()"> 助聽器</label>
    <label><input type="checkbox" id="ent_cavity" onchange="entAbnormal()"> 齲齒</label>
    <label><input type="checkbox" id="ent_perio" onchange="entAbnormal()"> 牙結石或牙周病</label>
    <label><input type="checkbox" id="ent_other" onchange="entAbnormal()"> 其他</label>
    <input type="text" id="ent_note" style="width:140px;padding:.3rem .6rem;border:1px solid #e0ddd6;border-radius:6px;font-size:.82rem;background:#faf9f7;" placeholder="附註" oninput="entOtherNote()">
  </div>

  <div class="subsection">頸部</div>
  <div class="grid-2">
    <div>
      <span style="font-size:.82rem;font-weight:600;color:#555;">淋巴腺腫大：</span>
      <div class="radio-group">
        <label><input type="radio" name="lym" value="no" checked> 無</label>
        <label><input type="radio" name="lym" value="yes"> 有</label>
      </div>
    </div>
    <div>
      <span style="font-size:.82rem;font-weight:600;color:#555;">甲狀腺腫大：</span>
      <div class="radio-group">
        <label><input type="radio" name="thy" value="no" checked> 無</label>
        <label><input type="radio" name="thy" value="yes"> 有</label>
      </div>
    </div>
  </div>

  <div class="subsection">胸腹四肢</div>
  <div id="exam_sections"></div>

  <div style="margin-top:.75rem;display:flex;align-items:center;gap:.5rem;">
    <span style="font-size:.82rem;font-weight:600;color:#555;white-space:nowrap;">其他異常：</span>
    <input type="text" id="other_abnormal" value="無" style="width:260px;padding:.35rem .65rem;border:1px solid #e0ddd6;border-radius:6px;font-size:.85rem;background:#faf9f7;">
  </div>

  <div class="subsection">情緒檢測</div>
  <div style="margin-bottom:.5rem;">
    <span style="font-size:.82rem;color:#444;">情緒低落、沮喪或沒有希望？</span>
    <div class="radio-group" style="margin-top:.25rem;">
      <label><input type="radio" name="dep1" value="no" checked> 否</label>
      <label><input type="radio" name="dep1" value="yes"> 是</label>
    </div>
  </div>
  <div>
    <span style="font-size:.82rem;color:#444;">做事情失去興趣或樂趣？</span>
    <div class="radio-group" style="margin-top:.25rem;">
      <label><input type="radio" name="dep2" value="no" checked> 否</label>
      <label><input type="radio" name="dep2" value="yes"> 是</label>
    </div>
  </div>
</div>

<!-- ══ 報告輸入 ══ -->
<div class="card">
  <div class="section-title">輸入檢驗報告</div>
  <div class="tab-row">
    <button class="tab-btn" onclick="switchTab('file')">📄 上傳檔案</button>
    <button class="tab-btn active" onclick="switchTab('paste')">📋 貼上原始資料</button>
  </div>
  <div class="tab-panel" id="tab-file">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="icon">📄</span>
      <p>點擊或拖曳檔案至此處</p>
      <span>支援 .txt 純文字格式</span>
    </div>
    <input type="file" id="fileInput" accept=".txt,text/plain">
  </div>
  <div class="tab-panel active" id="tab-paste">
    <textarea class="paste-input" id="pasteInput" placeholder="將檢驗報告的原始文字內容貼在這裡…"></textarea>
    <p class="paste-hint">貼上後點擊下方按鈕開始提取</p>
    <div class="btn-row" style="margin-top:.65rem;">
      <button class="btn btn-primary" onclick="processPaste()">開始提取</button>
      <button class="btn btn-outline" onclick="clearPaste()">清除</button>
    </div>
  </div>
  <p id="status"></p>
</div>

<!-- ══ 結果 ══ -->
<div class="card hidden" id="resultSection">
  <div class="section-title">提取結果</div>
  <div style="margin-bottom:1rem;">
    <div class="result-title">📋 成健資料</div>
    <div class="tag-row" id="tags1"></div>
    <div class="result-label">預覽</div>
    <textarea class="csv-out" id="csv1Out" readonly></textarea>
  </div>
  <hr class="divider">
  <div>
    <div class="result-title">📋 長健資料</div>
    <div class="tag-row" id="tags2"></div>
    <div class="result-label">預覽</div>
    <textarea class="csv-out" id="csv2Out" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="generateWord()">📝 生成成人＋長者 Word 報告</button>
  </div>
  <div id="filePathInfo" class="file-path-info"></div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ── Build exam section rows ───────────────────────────────
const EXAM_SECTIONS=[
  {id:'chest', label:'胸部'},
  {id:'cv',    label:'心臟聽診'},
  {id:'breath',label:'呼吸聽診'},
  {id:'abd',   label:'腹部'},
  {id:'ext',   label:'四肢'},
];
(function(){
  const con=document.getElementById('exam_sections');
  EXAM_SECTIONS.forEach(s=>{
    con.innerHTML+=`<div class="exam-row">
      <span class="exam-label">${s.label}</span>
      <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;">
        <div class="radio-group" style="margin:0;">
          <label><input type="radio" name="${s.id}" id="${s.id}_ok" value="ok" checked> 無明顯異常</label>
          <label><input type="radio" name="${s.id}" id="${s.id}_ab" value="ab"> 異常：</label>
        </div>
        <input type="text" id="${s.id}_note" style="width:160px;padding:.3rem .6rem;border:1px solid #e0ddd6;border-radius:6px;font-size:.82rem;background:#faf9f7;" placeholder="附註" oninput="document.getElementById('${s.id}_ab').checked=true">
      </div>
    </div>`;
  });
})();

function entAbnormal(){
  if(['ent_hearing','ent_cavity','ent_perio','ent_other'].some(id=>document.getElementById(id).checked))
    document.getElementById('ent2').checked=true;
}
function entOtherNote(){
  if(document.getElementById('ent_note').value.trim()){
    document.getElementById('ent_other').checked=true;
    document.getElementById('ent2').checked=true;
  }
}

// ── Auto-calc ─────────────────────────────────────────────
function parseDate8(s){
  s=(s||'').replace(/\D/g,'');
  if(s.length!==8)return null;
  const d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
  return isNaN(d)?null:d;
}
function fmtDate(s){
  s=(s||'').replace(/\D/g,'');
  if(s.length!==8)return s;
  return +s.slice(0,4)+'/'+  +s.slice(4,6)+'/'+  +s.slice(6,8);
}
function calcAge(){
  const dob=parseDate8(document.getElementById('f_dob').value);
  const exam=parseDate8(document.getElementById('f_date').value);
  if(!dob||!exam){document.getElementById('f_age').value='';return;}
  let age=exam.getFullYear()-dob.getFullYear();
  const m=exam.getMonth()-dob.getMonth();
  if(m<0||(m===0&&exam.getDate()<dob.getDate()))age--;
  document.getElementById('f_age').value=age>=0?age:'';
}
function calcBMI(){
  const h=parseFloat(document.getElementById('f_bh').value);
  const w=parseFloat(document.getElementById('f_bw').value);
  if(!h||!w||h<=0){document.getElementById('f_bmi').value='';return;}
  document.getElementById('f_bmi').value=(w/(h*h/10000)).toFixed(2);
}

// ── Tab ───────────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&name==='file')||(i===1&&name==='paste')));
  document.getElementById('tab-file').classList.toggle('active',name==='file');
  document.getElementById('tab-paste').classList.toggle('active',name==='paste');
  setStatus('','');
}
function processPaste(){
  const t=document.getElementById('pasteInput').value.trim();
  if(!t){setStatus('請先貼上報告內容','err');return;}
  rawText=t;setStatus('開始提取…','ok');setTimeout(processReport,50);
}
function clearPaste(){document.getElementById('pasteInput').value='';setStatus('','');}

// ── File upload ───────────────────────────────────────────
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])loadFile(fileInput.files[0]);});
function loadFile(file){
  const reader=new FileReader();
  reader.onload=e=>{rawText=e.target.result;dropZone.classList.add('file-loaded');dropZone.querySelector('.icon').textContent='✅';dropZone.querySelector('p').textContent=file.name;setStatus('載入成功，開始提取…','ok');setTimeout(processReport,100);};
  reader.onerror=()=>setStatus('讀取失敗','err');
  reader.readAsText(file,'UTF-8');
}
function setStatus(m,c){const el=document.getElementById('status');el.textContent=m;el.className=c||'';}

// ── Field definitions ─────────────────────────────────────
const FIELDS_1=[
  {label:'總膽固醇',           keys:['cholesterol'],           ref:'<200'      },
  {label:'低密度脂蛋白',       keys:['ldl'],                   ref:'<100'      },
  {label:'高密度脂蛋白',       keys:['hdl'],                   ref:'>40'       },
  {label:'三酸甘油脂',         keys:['triglyceride'],          ref:'<150'      },
  {label:'血醣',               keys:['glucose'],               ref:'70~100',    serum:true },
  {label:'尿酸',               keys:['uric acid','uricacid'],  ref:'4.40~7.60' },
  {label:'肌酸酐',             keys:['creatinine'],            ref:'0.70~1.30' },
  {label:'腎絲球過濾率(eGFR)', keys:['egfr','gfr'],           ref:'>60.0'     },
  {label:'GOT',                keys:['ast','got'],             ref:'13~39'     },
  {label:'GPT',                keys:['alt','gpt'],             ref:'7~52'      },
  {label:'尿潛血',             keys:['blood'],                 ref:'(-)',       urine:true },
  {label:'尿白血球脂脢',       keys:['leucocyte','leukocyte'], ref:'(-)~(+/-)', urine:true },
  {label:'尿液亞硝酸鹽',      keys:['nitrite'],               ref:'(-)',       urine:true },
  {label:'尿蛋白',             keys:['protein'],               ref:'(-)',       urine:true },
  {label:'尿糖',               keys:['glucose'],               ref:'(-)',       urine:true },
];
const FIELDS_2=[
  {label:'白血球',         keys:['wbc'],                              ref:'4.14~10.52'},
  {label:'紅血球',         keys:['rbc'],                              ref:'4.31~5.95' },
  {label:'血色素',         keys:['hb','hemoglobin','haemoglobin'],    ref:'13.4~17.2' },
  {label:'平均紅血球容積', keys:['mcv'],                              ref:'83.4~98.5' },
  {label:'血小板',         keys:['platelet'],                         ref:'160~370'   },
  {label:'糖化血色素',     keys:['hba1c','hb a1c','a1c','壽-hba1c'], ref:'4.0~5.5'   },
  {label:'鈣離子',         keys:['calcium'],                          ref:'8.6~10.3'  },
  {label:'白蛋白',         keys:['albumin'],                          ref:'3.5~5.7'   },
  {label:'gamma-GT',       keys:['g-gt','ggt','gamma-gt','γ-gt'],     ref:'9~64'      },
  {label:'甲狀腺刺激素',   keys:['tsh'],                              ref:'0.380~5.330'},
  {label:'維他命B12',      keys:['vitamin b12','b12'],                ref:'247~911'   },
  {label:'葉酸',           keys:['folic','folate'],                   ref:'5.39~20.57'},
  {label:'25-OH維他命D',   keys:['25-oh','vitamin d','vit. d','vit d'],ref:'30.0~100.0'},
];

// Row 1 headers — exact match of xls
const HEADERS_1={
  1:'總膽固醇',2:'低密度脂蛋白',3:'高密度脂蛋白',4:'三酸甘油脂',5:'血醣',
  6:'尿酸',7:'肌酸酐',8:'腎絲球過濾率(eGFR)',9:'GOT',10:'GPT',
  11:'尿潛血',12:'尿白血球脂脢',13:'尿液亞硝酸鹽',14:'尿蛋白',15:'尿糖',

// ── Parsing ───────────────────────────────────────────────
function buildRowSets(text){
  const lines=text.split('\n');
  const skip=l=>!l||/^[=\-]/.test(l)||/^(檢驗項目|學門別|收件|一日|檢體|醫囑|採檢|檢驗結果)/.test(l);
  let urine=[],serum=[],all=[],inUrine=false;
  for(const raw of lines){
    if(raw.includes('檢體別:U'))inUrine=true;
    else if(raw.includes('檢體別:B'))inUrine=false;
    const l=raw.trim();if(skip(l))continue;
    all.push(l);(inUrine?urine:serum).push(l);
  }
  return{urine,serum,all};
}
// 從報告行中提取參考值（報告格式：項目名  檢驗值  單位  H/L  參考值）
function extractRefFromRows(rows,keys){
  for(const row of rows){
    const lower=row.toLowerCase();
    for(const key of keys){
      if(lower.startsWith(key.toLowerCase())){
        const parts=row.split(/\s{2,}/);
        // 由後往前找第一個像參考值的欄位（含範圍符號 ~、<、> 或括號開頭）
        for(let i=parts.length-1;i>=1;i--){
          const p=parts[i].trim();
          if(/[~<>]/.test(p)||/^\(/.test(p)){
            return p;
          }
        }
      }
    }
  }
  return'';
}
function getRef(field,sets){
  const rows=field.urine?sets.urine:(field.serum?sets.serum:sets.all);
  const fromReport=extractRefFromRows(rows,field.keys);
  return fromReport||field.ref;
}
function extractFromRows(rows,keys){
  for(const row of rows){
    const lower=row.toLowerCase();
    for(const key of keys){
      if(lower.startsWith(key.toLowerCase())){
        const parts=row.split(/\s{2,}/);
        if(parts.length>=2){
          // 數字前有空白才算是黏著的值（如 "Glucose fasting 88"），避免誤抓名稱中的數字（如 "Vitamin B12"）
          const numInName=parts[0].match(/\s(\d+[+\-]?)\s*$/);
          if(numInName)return numInName[1].trim();
          // 欄位名被截斷且值（+/-或數字+號）直接黏在名稱字母後（如 "Leucocyte easter2+"）
          const stickyVal=parts[0].match(/[a-zA-Z](\d+[+\-]|[+\-])\s*$/);
          if(stickyVal)return stickyVal[1].trim();
          // parts[1] 若只是單一 H/L 旗標則略過，取後面的值或回傳空
          const v=parts[1].trim().replace(/\s.*$/,'');
          if(v.length>1||/\d/.test(v))return v;
          // parts[1] 是 H/L，值可能在 parts[0] 最後一個空格後
          const fromName=parts[0].match(/\s([\d.]+[+\-]?|[+\-])$/);
          if(fromName)return fromName[1].trim();
        }
        const tv=row.match(/(\d+[+\-]?|[+\-])\s*$/);
        if(tv)return tv[1].trim();
      }
    }
  }
  return'';
}
function getValue(field,sets){
  if(field.urine)return extractFromRows(sets.urine,field.keys);
  if(field.serum)return extractFromRows(sets.serum,field.keys);
  return extractFromRows(sets.all,field.keys);
}
let dynamicRefs1=[], dynamicRefs2=[];
function processReport(){
  const sets=buildRowSets(rawText);
  extractedVals1=FIELDS_1.map(f=>getValue(f,sets));
  extractedVals2=FIELDS_2.map(f=>getValue(f,sets));
  dynamicRefs1=FIELDS_1.map(f=>getRef(f,sets));
  dynamicRefs2=FIELDS_2.map(f=>getRef(f,sets));
  csv1=FIELDS_1.map(f=>f.label).join(',')+'\n'+dynamicRefs1.join(',')+'\n'+extractedVals1.join(',');
  csv2=FIELDS_2.map(f=>f.label).join(',')+'\n'+dynamicRefs2.join(',')+'\n'+extractedVals2.join(',');
  document.getElementById('csv1Out').value=csv1;
  document.getElementById('csv2Out').value=csv2;
  renderTags('tags1',FIELDS_1,sets);
  renderTags('tags2',FIELDS_2,sets);
  document.getElementById('resultSection').classList.remove('hidden');
  setStatus('提取完成！','ok');
}
function renderTags(id,fields,sets){
  const c=document.getElementById(id);c.innerHTML='';
  for(const f of fields){
    const found=getValue(f,sets)!=='';
    const s=document.createElement('span');
    s.className='tag '+(found?'found':'missing');
    s.textContent=(found?'✓ ':'✗ ')+f.label;
    c.appendChild(s);
  }
}

function sc(ws,r,c,v){const a=XLSX.utils.encode_cell({r,c});ws[a]={v:String(v??''),t:'s'};}

function makeSheet1(labVals){
  const ws={}, maxCol=118;
  for(const[col,hdr]of Object.entries(HEADERS_1)) sc(ws,0,+col-1,hdr);
  // 靜態參考值（非檢驗項目欄位）
  for(const[col,ref]of Object.entries(REFS_1))    sc(ws,1,+col-1,ref);
  // 動態參考值（從報告提取，覆蓋欄 1~15）
  if(dynamicRefs1.length) dynamicRefs1.forEach((r,i)=>sc(ws,1,i,r));
  const fv=collectFormValues();
  for(const[col,val]of Object.entries(fv))        sc(ws,1,+col-1,val);
  labVals.forEach((v,i)=>sc(ws,1,40+i,v));
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:1,c:maxCol-1}});
  ws['!cols']=Array.from({length:maxCol},(_,i)=>({wch:HEADERS_1[i+1]?Math.max(String(HEADERS_1[i+1]).length*2,10):3}));
  return ws;
}

function wv(ws,r,c){const a=XLSX.utils.encode_cell({r:r-1,c:c-1});return ws[a]?ws[a].v:'';}
function wset(ws,r,c,v){sc(ws,r-1,c-1,v);}
function num(v){return parseFloat(String(v).replace(/[^\d.\-]/g,''))||0;}
function splitRef(ref,sep){const p=String(ref).split(sep);return p.map(x=>parseFloat(x.trim())||0);}

function 資料判讀(ws1,ws2){

  else acTxt='正常。';

  else if(blood51==='-'&&leuko==='-'&&nitrite==='-'&&prot!=='-') urineTxt='尿蛋白，疑似腎臟病變。';
  else if(blood51!=='-'&&leuko==='-'&&nitrite==='-'&&prot!=='-') urineTxt='疑似尿路病變。';
  else if(blood51!=='-'&&leuko!=='-'&&nitrite==='-'&&prot!=='-') urineTxt='疑似泌尿道感染或未正確留取中段尿。';
  else if(blood51!=='-'&&leuko!=='-'&&nitrite==='-'&&prot==='-') urineTxt='疑似泌尿道感染或未正確留取中段尿。';
  else if(blood51==='-'&&leuko!=='-'&&nitrite==='-'&&prot!=='-') urineTxt='疑似泌尿道感染或未正確留取中段尿。';
  if(urineTxt) wset(ws1,2,111,urineTxt);

  // 尿糖
  if(uGlu!=='-') wset(ws1,2,114,'尿中有糖份，疑似糖尿病或正在服用SGLT2-i。');

  // 尿酸
  const [,uUA]=splitRef(wv(ws1,2,6),'~');
  if(num(wv(ws1,2,46))>uUA) wset(ws1,2,115,'尿酸偏高。');

  // B肝 / C肝
  if(String(wv(ws1,2,82)).includes('■陽性')) wset(ws1,2,117,'B型肝炎帶原。');
  if(String(wv(ws1,2,83)).includes('■陽性')) wset(ws1,2,118,'C型肝炎帶原。');

  // 成健 col 107-117：全部空白才在 107 填「無其他異常。」，有內容的往左靠，空欄移到右邊
  const allEmpty1 = [107,108,109,110,111,112,113,114,115,116,117].every(c=>!wv(ws1,2,c));
  if(allEmpty1) wset(ws1,2,107,'無其他異常。');
  compactCols(ws1, 107, 117);
}

function 長健判讀(ws2){
  // 白血球
  const [lWBC,uWBC]=splitRef(wv(ws2,2,1),'~');
  const wbc=num(wv(ws2,2,41));
  if(wbc<lWBC) wset(ws2,2,61,'白血球偏低。');
  else if(wbc>uWBC) wset(ws2,2,61,'白血球偏高。');

  // 血色素 & 貧血
  const [lHb,uHb]=splitRef(wv(ws2,2,3),'~');
  const [lMCV,uMCV]=splitRef(wv(ws2,2,4),'~');
  const hb=num(wv(ws2,2,43)), mcv=num(wv(ws2,2,44)), rbc=num(wv(ws2,2,42));
  let anemiaTxt='';
  if(rbc>0&&mcv/rbc<13) anemiaTxt='疑似帶有海洋性貧血基因。';
  if(hb<lHb) anemiaTxt='正球性貧血。';
  if(hb<lHb&&mcv>uMCV) anemiaTxt='大球性貧血。';
  if(hb<lHb&&mcv<lMCV&&rbc>0&&mcv/rbc<13) anemiaTxt='疑似海洋性貧血。';
  if(hb<lHb&&mcv<lMCV&&rbc>0&&mcv/rbc>13) anemiaTxt='疑似缺鐵性貧血。';
  if(hb>uHb) anemiaTxt='血色素過高，請注意是否有長期缺氧狀況或血液疾病。';
  if(anemiaTxt) wset(ws2,2,62,anemiaTxt);

  // 血小板
  const [lPlt,uPlt]=splitRef(wv(ws2,2,5),'~');
  const plt=num(wv(ws2,2,45));
  if(plt<lPlt) wset(ws2,2,63,'血小板偏低。');
  else if(plt>uPlt) wset(ws2,2,63,'血小板偏高。');

  // 糖化血色素
  const [,uA1C]=splitRef(wv(ws2,2,6),'~');
  const a1c=num(wv(ws2,2,46));
  let a1cTxt='';
  if(a1c>7)    a1cTxt='糖化血色素過高，請注意是否糖尿病控制不良。';
  else if(a1c>6.5) a1cTxt='糖化血色素偏高，請注意是否有糖尿病。';
  else if(a1c>uA1C) a1cTxt='糖化血色素稍高，請注意飲食及運動狀況。';
  if(a1cTxt) wset(ws2,2,64,a1cTxt);

  // 鈣離子
  const [lCa,uCa]=splitRef(wv(ws2,2,7),'~');
  const ca=num(wv(ws2,2,47));
  let caTxt='';
  if(ca<lCa) caTxt='鈣離子偏低，請進一步檢查游離鈣以確認。';
  else if(ca>uCa) caTxt='鈣離子偏高，請就醫進一步檢查。';
  if(caTxt) wset(ws2,2,65,caTxt);

  // 白蛋白
  const [lAlb,uAlb]=splitRef(wv(ws2,2,8),'~');
  const alb=num(wv(ws2,2,48));
  if(alb<lAlb){
    wset(ws2,2,66,'白蛋白偏低，請進一步就醫檢查。');
    if(String(wv(ws2,2,65))==='鈣離子偏低，請進一步檢查游離鈣以確認。')
      wset(ws2,2,65,'鈣離子偏低合併白蛋白偏低，可能由於白蛋白偏低導致之誤差，可進一步檢查游離鈣。');
  } else if(alb>uAlb) wset(ws2,2,66,'白蛋白偏高，抽血時可能有脫水情況。');

  // gamma-GT
  const [,uGGT]=splitRef(wv(ws2,2,9),'~');
  if(num(wv(ws2,2,49))>uGGT)
    wset(ws2,2,67,'gamma-GT偏高，請至腸胃科檢查，以排除酒精或藥物性肝炎，或膽道疾病之可能。');

  // 甲狀腺刺激素
  const [lTSH,uTSH]=splitRef(wv(ws2,2,10),'~');
  const tsh=num(wv(ws2,2,50));
  if(tsh<lTSH) wset(ws2,2,68,'甲狀腺刺激素偏低，請進一步檢查甲狀腺功能。');
  else if(tsh>uTSH) wset(ws2,2,68,'甲狀腺刺激素偏高，請進一步檢查甲狀腺功能。');

  // 維他命B12
  const [lB12]=splitRef(wv(ws2,2,11),'~');
  if(num(wv(ws2,2,51))<lB12){
    wset(ws2,2,69,'缺乏維他命B12，請注意是否為素食者並均衡飲食。');
    if(String(wv(ws2,2,62))==='大球性貧血。')
      wset(ws2,2,62,'大球性貧血，可能維他命B12不足所引起。');
  }

  // 葉酸
  const [lFA]=splitRef(wv(ws2,2,12),'~');
  if(num(wv(ws2,2,52))<lFA){
    wset(ws2,2,70,'缺乏葉酸，請注意均衡飲食。');
    if(String(wv(ws2,2,62))==='大球性貧血。')
      wset(ws2,2,62,'大球性貧血，可能葉酸不足所引起。');
    else if(String(wv(ws2,2,62))==='大球性貧血，可能維他命B12不足所引起。')
      wset(ws2,2,62,'大球性貧血，可能維他命B12及葉酸不足所引起。');
  }

  // 維他命D（參考值可能為 ">29.0" 或 "29.0~100.0" 兩種格式）
  const vitDRef=String(wv(ws2,2,13));
  const lD=vitDRef.startsWith('>')?parseFloat(vitDRef.slice(1)):splitRef(vitDRef,'~')[0];
  if(num(wv(ws2,2,53))<lD){
    wset(ws2,2,71,'缺乏維他命D，請多曬太陽或口服補充。');
    if(String(wv(ws2,2,65))==='鈣離子偏低，請進一步檢查游離鈣以確認。')
      wset(ws2,2,65,'鈣離子偏低，可能由於維他命D不足所引起。');
  }

  // 長健 col 61-71：全部空白才在 61 填「長者健檢項目皆無異常。」，有內容的往左靠，空欄移到右邊
  const allEmpty2 = [61,62,63,64,65,66,67,68,69,70,71].every(c=>!wv(ws2,2,c));
  if(allEmpty2) wset(ws2,2,61,'長者健檢項目皆無異常。');
  compactCols(ws2, 61, 71);
}

// ── 刪除空白欄並左移（1-based col）────────────────────────
// 對 ws 的第 2 列（row index 1），從 startCol 到 endCol 掃描
// 空的（空字串或只有空格）就跳過，非空的依序填入從 startCol 開始的位置
// 多出來的位置（原本有值現在移掉）清空，並更新 !ref
// ── 總評欄位壓縮：資料往左靠，標題從總評1連續編號，空欄資料清空 ──
// startCol~endCol 固定保留所有欄位及標題，但 row2 資料有內容的往左靠攏
function compactCols(ws, startCol, endCol){
  const totalCols = endCol - startCol + 1;
  // 收集有內容的資料值
  const vals = [];
  for(let c=startCol; c<=endCol; c++){
    const v = wv(ws, 2, c);
    if(String(v).trim() !== '' && String(v).trim() !== ' ') vals.push(v);
  }
  // 重新填入：有內容的從左開始，其餘清空（填空格）
  for(let i=0; i<totalCols; i++){
    const col = startCol + i;
    // 標題固定為總評N
    sc(ws, 0, col-1, '總評'+(i+1));
    // 資料：有內容靠左，空的清空
    if(i < vals.length) sc(ws, 1, col-1, vals[i]);
    else {
      const addr = XLSX.utils.encode_cell({r:1, c:col-1});
      delete ws[addr];
    }
  }
}

// 將新資料插入到既有工作表的指定行位置（已修正空白欄位被複製標題的問題）
function insertRowAtPosition(existingWs, newWs, insertAtRow){
  // 讀取既有工作表的範圍
  const existingRange = XLSX.utils.decode_range(existingWs['!ref']);
  const newRange = XLSX.utils.decode_range(newWs['!ref']);
  
  // 計算新的工作表範圍（行數增加1）
  const finalRange = {
    s: { r: existingRange.s.r, c: Math.min(existingRange.s.c, newRange.s.c) },
    e: { r: existingRange.e.r + 1, c: Math.max(existingRange.e.c, newRange.e.c) }
  };
  
  const resultWs = {};
  
  // 1. 先複製第一行（標題行）
  for(let c = existingRange.s.c; c <= existingRange.e.c; c++){
    const cellAddr = XLSX.utils.encode_cell({r: 0, c: c});
    if(existingWs[cellAddr]){
      resultWs[cellAddr] = existingWs[cellAddr];
    }
  }
  
  // 2. 插入新資料到第二行（並強制將未填寫的欄位設為空白，避免抓到舊資料或標題）
  const maxCol = finalRange.e.c;
  for(let c = 0; c <= maxCol; c++){
    const srcAddr = XLSX.utils.encode_cell({r: insertAtRow, c: c}); // 讀取新生成的第二行
    const dstAddr = XLSX.utils.encode_cell({r: insertAtRow, c: c}); // 寫入目標的第二行
    
    if(newWs[srcAddr] && newWs[srcAddr].v !== undefined && newWs[srcAddr].v !== null){
      resultWs[dstAddr] = {...newWs[srcAddr]};
    } else {
      // 如果新提取的資料在該欄位是空的，強制寫入空字串儲存格，確保它一定是空白
      resultWs[dstAddr] = {v: '', t: 's'};
    }
  }
  
  // 3. 將既有的舊資料向下移動（從原本的第二行挪到第三行）
  for(let r = 1; r <= existingRange.e.r; r++){
    for(let c = existingRange.s.c; c <= existingRange.e.c; c++){
      const srcAddr = XLSX.utils.encode_cell({r: r, c: c});
      const dstAddr = XLSX.utils.encode_cell({r: r + 1, c: c});
      if(existingWs[srcAddr]){
        resultWs[dstAddr] = {...existingWs[srcAddr]};
      }
    }
  }
  
  resultWs['!ref'] = XLSX.utils.encode_range(finalRange);
  
  // 保持原有的欄位寬度設定
  if(existingWs['!cols']) resultWs['!cols'] = existingWs['!cols'];
  
  return resultWs;
}

async function downloadXLSX(){
  if(!extractedVals1.length){setStatus('請先提取資料','err');return;}
  
  let wb, ws1, ws2;
  
  // 如果有既有檔案，則將新資料插入第二行
  if(existingWorkbook){
    wb = existingWorkbook;
    
    // 讀取現有的工作表
    const existingWs1 = wb.Sheets['成健資料'];
    const existingWs2 = wb.Sheets['長健資料'];
    
    if(!existingWs1 || !existingWs2){
      setStatus('❌ 既有檔案格式不正確，缺少「成健資料」或「長健資料」工作表','err');
      return;
    }
    
    // 生成新的資料行
    const newWs1 = makeSheet1(extractedVals1);
    const newWs2 = makeSheet2(extractedVals2);
    資料判讀(newWs1, newWs2);
    if(wv(newWs2, 2, 1)) 長健判讀(newWs2);
    
    // 插入新資料到第二行
    ws1 = insertRowAtPosition(existingWs1, newWs1, 1);
    ws2 = insertRowAtPosition(existingWs2, newWs2, 1);
    
    // 更新工作表
    wb.Sheets['成健資料'] = ws1;
    wb.Sheets['長健資料'] = ws2;
    
  } else {
    // 沒有既有檔案，建立新檔案
    wb = XLSX.utils.book_new();
    ws1 = makeSheet1(extractedVals1);
    ws2 = makeSheet2(extractedVals2);
    資料判讀(ws1, ws2);
    if(wv(ws2, 2, 1)) 長健判讀(ws2);
    XLSX.utils.book_append_sheet(wb, ws1, '成健資料');
    XLSX.utils.book_append_sheet(wb, ws2, '長健資料');
  }
  
  // 生成檔案內容
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  
  // 如果瀏覽器支援 File System Access API
  if(supportsFileSystemAccess){
    try{
      let fileHandle = savedFileHandle;
      
      // 如果還沒有儲存過檔案控制代碼,或控制代碼已失效,則請求使用者選擇
      if(!fileHandle){
        fileHandle = await window.showSaveFilePicker({
          suggestedName: '成長健資料.xlsx',
          types: [{
            description: 'Excel 檔案',
            accept: {'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx']}
          }]
        });
        savedFileHandle = fileHandle;
        updateFilePathDisplay(fileHandle.name);
      }
      
      // 寫入檔案
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      
      const msg = existingWorkbook ? '✅ 已將新資料插入並儲存至 ' + fileHandle.name : '✅ 已儲存至 ' + fileHandle.name;
      setStatus(msg,'ok');
    } catch(err){
      if(err.name === 'AbortError'){
        setStatus('已取消儲存','err');
      } else {
        console.error('儲存失敗:', err);
        setStatus('儲存失敗: ' + err.message,'err');
        // 如果失敗,回退到傳統下載方式
        fallbackDownload(blob, existingWorkbook);
      }
    }
  } else {
    // 瀏覽器不支援,使用傳統下載方式
    fallbackDownload(blob, existingWorkbook);
  }
}

// 傳統下載方式
function fallbackDownload(blob, hasExisting){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '成長健資料.xlsx';
  a.click();
  URL.revokeObjectURL(a.href);
  const msg = hasExisting ? '✅ 已將新資料插入並下載 成長健資料.xlsx' : '✅ 已下載 成長健資料.xlsx';
  setStatus(msg,'ok');
}

async function handleExistingFile(e){
  const file = e.target.files[0];

  try {
    const arrayBuffer = await file.arrayBuffer();
    existingWorkbook = XLSX.read(arrayBuffer, {type: 'array'});
    
    document.getElementById('existingFileName').textContent = '✓ ' + file.name;
    document.getElementById('existingFileName').style.color = '#3B6D11';

  } catch(err) {
    document.getElementById('existingFileStatus').textContent = '❌ 檔案讀取失敗: ' + err.message;
    document.getElementById('existingFileStatus').style.color = '#a32d2d';

}

  document.getElementById('existingFileInput').value = '';

  document.getElementById('existingFileStatus').textContent = '';

const FIELD_MAP={'gamma-GT':'gammaGT','25-OH維他命D':'M_25OH維他命D','腎絲球過濾率(eGFR)':'腎絲球過濾率eGFR'};
function buildMergeData(ws,kind){
  const maxCol=kind==='adult'?117:71, refEnd=kind==='adult'?15:13, d={};
  for(let c=1;c<=maxCol;c++){
    const h=String(wv(ws,1,c)||'').trim();if(!h)continue;
    const n=FIELD_MAP[h]||h, v=String(wv(ws,2,c)??'');
    if(c<=refEnd||(c>=21&&c<=40)||c>=61)d[n]=v;
    else if(c>=41&&c<=60)d[n+'1']=v;
  }
  return d;
}

const $w=(el,n)=>[...el.childNodes].filter(x=>x.nodeType===1&&x.localName===n&&x.namespaceURI===W_NS);
function runText(r){let s='';for(const c of r.childNodes){if(c.nodeType!==1)continue;if(c.localName==='t')s+=c.textContent;else if(c.localName==='tab')s+='\t';else if(c.localName==='br'||c.localName==='cr')s+='\n';}return s;}
const fname=s=>{const m=/MERGEFIELD\s+(?:"([^"]+)"|(\S+))/i.exec(s||'');return m?(m[1]||m[2]):null;};

function mergeFields(doc,data,missing){
  const mkRun=(rPr,text)=>{
    const r=doc.createElementNS(W_NS,'w:r');if(rPr)r.appendChild(rPr.cloneNode(true));
    text.split('\n').forEach((line,i)=>{
      if(i)r.appendChild(doc.createElementNS(W_NS,'w:br'));
      const t=doc.createElementNS(W_NS,'w:t');t.setAttributeNS(XML_NS,'xml:space','preserve');t.textContent=line;r.appendChild(t);
    });
    return r;
  };
  const val=n=>{if(n in data)return data[n];missing.add(n);return null;};
  // 簡單欄位 w:fldSimple
  [...doc.getElementsByTagNameNS(W_NS,'fldSimple')].forEach(f=>{
    const n=fname(f.getAttributeNS(W_NS,'instr'));if(!n)return;
    const v=val(n);if(v===null)return;
    const r0=f.getElementsByTagNameNS(W_NS,'r')[0];
    f.parentNode.replaceChild(mkRun(r0?$w(r0,'rPr')[0]:null,v),f);
  });
  // 複雜欄位 fldChar begin/separate/end
  [...doc.getElementsByTagNameNS(W_NS,'p')].forEach(p=>{
    let cur=null;
    for(const r of $w(p,'r')){
      const types=$w(r,'fldChar').map(e=>e.getAttributeNS(W_NS,'fldCharType'));
      if(!cur&&types.includes('begin'))cur={runs:[r],instr:'',sep:false,rPr:null};
      else if(cur)cur.runs.push(r);
      if(!cur)continue;
      if(!cur.sep)[...r.getElementsByTagNameNS(W_NS,'instrText')].forEach(e=>cur.instr+=e.textContent);
      if(types.includes('separate'))cur.sep=true;
      else if(cur.sep&&!cur.rPr&&$w(r,'t').length)cur.rPr=$w(r,'rPr')[0]||null;
      if(types.includes('end')){
        const n=fname(cur.instr),v=n?val(n):null;
        if(v!==null){
          const first=cur.runs[0];
          first.parentNode.insertBefore(mkRun(cur.rPr||$w(first,'rPr')[0]||null,v),first);
          cur.runs.forEach(x=>x.parentNode.removeChild(x));
        }
        cur=null;
      }
    }
  });
}

}
function markAbnormal(doc,kind){
  const body=doc.getElementsByTagNameNS(W_NS,'body')[0];if(!body)return 0;
  const paras=new Set();
  $w(body,'tbl').forEach(t=>$w(t,'tr').forEach(tr=>$w(tr,'tc').forEach(tc=>$w(tc,'p').forEach(p=>paras.add(p)))));
  const pt=p=>$w(p,'r').map(runText).join('');
  const full=[...paras].map(pt).join('\n');
  let n=0;
  for(const [kw,field] of RULES[kind]){
    if(kw&&!full.includes(kw))continue;
    for(const p of paras){
      const text=pt(p);
      if(field==='血色素：'&&text.includes('糖化血色素：'))continue;
      if(!text.includes(field))continue;
      const end=text.indexOf(field)+field.length;let cur=0;
      for(const r of $w(p,'r')){
        const t=runText(r);
        if(cur>=end){
          if(/^\d+/.test(t)||SYMS[kind].includes(t)){setRPr(r,'color','FF0000');setRPr(r,'highlight','yellow');n++;}
          else if(t.trim())break;
        }
        cur+=t.length;
      }
    }
  }
  return n;
}
async function mergeDocx(buf,data,kind,missing){
  const zip=await JSZip.loadAsync(buf);
  const names=Object.keys(zip.files).filter(n=>/^word\/(document|header\d*|footer\d*)\.xml$/.test(n));
  for(const n of names){
    const doc=new DOMParser().parseFromString(await zip.file(n).async('string'),'application/xml');
    if(doc.getElementsByTagName('parsererror').length)throw new Error('範本 XML 解析失敗：'+n);
    mergeFields(doc,data,missing);
    if(n==='word/document.xml')markAbnormal(doc,kind);
    zip.file(n,'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/,''),{createFolders:false});
  }
  // 範本帶有「合併列印資料來源」設定（連到原電腦的 xlsx）；欄位已填完，必須移除，否則 Word 會因找不到資料來源而打不開
  if(zip.file('word/settings.xml')){
    const st=(await zip.file('word/settings.xml').async('string')).replace(/<w:mailMerge[\s>][\s\S]*?<\/w:mailMerge>/,'');
    zip.file('word/settings.xml',st,{createFolders:false});
  }
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE'});
}

// ── 主流程：表單＋檢驗報告 → 兩份 Word ──
async function generateWord(){
  if(!extractedVals1.length){setStatus('請先提取資料','err');return;}
  const name=g('f_name');if(!name){setStatus('請先填寫姓名','err');return;}
  if(!tpl.adult||!tpl.elder){setStatus('範本載入失敗','err');return;}
  try{
    setStatus('生成中…','ok');
    const ws1=makeSheet1(extractedVals1), ws2=makeSheet2(extractedVals2);
    資料判讀(ws1,ws2);if(wv(ws2,2,1))長健判讀(ws2);
    const safe=name.replace(/[\\/:*?"<>|]/g,'_'), files=[], miss=new Set();
    for(const [kind,ws,label] of [['adult',ws1,'成人健檢報告'],['elder',ws2,'長者健檢報告']]){
      const m=new Set();
      const blob=await mergeDocx(tpl[kind].buf,buildMergeData(ws,kind),kind,m);
      m.forEach(x=>miss.add(x));
      files.push({name:safe+label+'.docx',blob});
    }
    const warn=miss.size?'　⚠ 範本中有欄位找不到對應資料：'+[...miss].join('、'):'';
    await saveFiles(files,warn);
  }catch(e){console.error(e);setStatus('❌ 生成失敗：'+e.message,'err');}
}
async function saveFiles(files,warn){
  try{
    if(window.showDirectoryPicker){
      if(!outDir)outDir=await window.showDirectoryPicker({mode:'readwrite'});
      for(const f of files){const h=await outDir.getFileHandle(f.name,{create:true});const w=await h.createWritable();await w.write(f.blob);await w.close();}
      setStatus('✅ 已儲存至資料夾「'+outDir.name+'」：'+files.map(f=>f.name).join('、')+warn,'ok');return;
    }
  }catch(e){
    if(e.name==='AbortError'){setStatus('已取消儲存','err');return;}
    console.error(e);outDir=null;
  }
  for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
  setStatus('✅ 已下載：'+files.map(f=>f.name).join('、')+warn,'ok');
}
